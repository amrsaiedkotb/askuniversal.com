<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Message Sent | ASK</title>
  <link rel="icon" type="image/png" href="assets/media/favicon-ask.png"><link rel="apple-touch-icon" href="assets/media/apple-touch-icon.png">
  <style>
    :root{--gold:#C8A45D;--black:#0B1220;--black-mid:#111A2E;--border:rgba(200,164,93,0.14);--white:#FFFFFF;--white-dim:#C9CCD4;}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at top, rgba(200,164,93,0.08), transparent 42%),var(--black);color:var(--white);font-family:'IBM Plex Sans Arabic',sans-serif}
    .card{margin:calc(var(--site-nav-height, 76px) + 64px) auto 80px;width:min(100% - 32px,720px);box-sizing:border-box;background:var(--black-mid);border:1px solid var(--border);padding:40px 32px;border-radius:20px;text-align:center;box-shadow:0 22px 80px rgba(0,0,0,.35)}
    h1{margin:0 0 16px;font-family:'Noto Kufi Arabic',sans-serif;font-size:clamp(40px,6vw,64px);font-weight:600;color:var(--gold)}
    p{margin:0 auto 14px;max-width:560px;color:var(--white-dim);line-height:1.8;font-size:15px}
    .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 22px;border-radius:999px;border:1px solid var(--border);text-decoration:none;color:var(--white);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
    .btn.primary{background:#C8A45D !important;color:#0B1220 !important;border-color:transparent;font-weight:600}
  
.page-bg{position:fixed;inset:0;z-index:-2;pointer-events:none;background-color:#0B1220;background-image:url('assets/media/bg-pyramids-night.webp');background-repeat:no-repeat;background-position:center center;}
@media(orientation:landscape){.page-bg{background-size:cover;}}
@media(orientation:portrait){.page-bg{background-size:100% auto;background-position:center 30%;}}
.page-bg::after{content:'';position:absolute;inset:0;}
@media(orientation:landscape){.page-bg::after{background:rgba(6,12,24,0.24);}}
@media(orientation:portrait){.page-bg::after{background:rgba(6,12,24,0.32);}}
</style>
<link rel="stylesheet" href="assets/css/site-typography.css?v=202611261657">
<link rel="stylesheet" href="assets/css/site-responsive.css?v=202611261657">
<link rel="stylesheet" href="assets/css/ask-theme.css?v=202611261657">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<nav id="nav"></nav>
<div class="mobile-menu" id="mobile-menu"></div>
<div class="page-bg"></div>
  <main class="card">
    <h1><span class="ar">تم إرسال رسالتك</span><span class="en">Message Sent</span></h1>
    <p>Your message has been sent to the <img class="inline-brand-logo" src="assets/media/logo-ask-new.png" alt=""> team. We will review it and respond through the email address you submitted.</p>
    <p>تم إرسال رسالتك إلى فريق <img class="inline-brand-logo" src="assets/media/logo-ask-new.png" alt=""> سنراجعها ونتواصل معك عبر البريد الإلكتروني الذي أدخلته.</p>
    <div class="actions">
      <a class="btn primary" href="contact-us.html"><span class="ar">العودة لصفحة التواصل</span><span class="en">Back to Contact</span></a>
      <a class="btn" href="index.html"><span class="ar">الصفحة الرئيسية</span><span class="en">Return Home</span></a>
    </div>
  </main>
<footer></footer>
<script src="assets/js/ask-contact.js?v=202611261657"></script>
<script src="assets/js/site-responsive.js?v=202611261657"></script>
</body>
</html>
