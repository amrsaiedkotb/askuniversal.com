<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>تغيير كلمة المرور | ASK</title>
<link rel="icon" type="image/png" href="assets/media/favicon-ask.png">
<link rel="stylesheet" href="assets/css/site-typography.css?v=202611261659">
<link rel="stylesheet" href="assets/css/site-responsive.css?v=202611261659">
<link rel="stylesheet" href="assets/css/ask-theme.css?v=202611261659">
<link rel="stylesheet" href="assets/css/portal.css?v=202611261659">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="portal-body">
<a href="index.html" class="portal-home-link" aria-label="Back to website">←</a>

<div class="auth-shell">
  <div class="auth-wrap">
    <div class="auth-logo">
      <img src="assets/media/logo-ask-new.png" alt="ASK">
    </div>

    <div class="lang-btns">
      <button class="lang-btn active" id="btn-ar" type="button" onclick="setLang('ar')">العربية</button>
      <button class="lang-btn" id="btn-en" type="button" onclick="setLang('en')">English</button>
    </div>

    <div class="auth-card">
      <div class="auth-eyebrow">
        <span class="ar-txt">بوابة العملاء</span>
        <span class="en-txt">Client Portal</span>
      </div>

      <h1>
        <span class="ar-txt">تغيير كلمة المرور</span>
        <span class="en-txt">Change Password</span>
      </h1>

      <p class="sub">
        <span class="ar-txt">استخدم هذه الصفحة أثناء وجود جلسة دخول نشطة لتعيين كلمة مرور جديدة للحساب.</span>
        <span class="en-txt">Use this page while you have an active session to set a new account password.</span>
      </p>

      <div class="msg" id="reset-msg"></div>

      <label for="reset-pass">
        <span class="ar-txt">كلمة المرور الجديدة</span>
        <span class="en-txt">New Password</span>
      </label>
      <input type="password" id="reset-pass" autocomplete="new-password">

      <label for="reset-pass-confirm">
        <span class="ar-txt">تأكيد كلمة المرور</span>
        <span class="en-txt">Confirm Password</span>
      </label>
      <input type="password" id="reset-pass-confirm" autocomplete="new-password">

      <button class="btn btn-primary btn-block" id="reset-btn" type="button" onclick="updatePassword()">
        <span class="ar-txt">تحديث كلمة المرور</span>
        <span class="en-txt">Update Password</span>
      </button>

      <div class="auth-footer">
        <span class="ar-txt"><a href="index.html">العودة إلى الموقع</a></span>
        <span class="en-txt"><a href="index.html">Back to website</a></span>
      </div>
    </div>
  </div>
</div>

<script type="module" src="assets/js/reset-password.js?v=202611261659"></script>
<script src="assets/js/ask-contact.js?v=202611261659"></script>
<script src="assets/js/site-responsive.js?v=202611261659"></script>
</body>
</html>
